name: Monitor de teles

on:
  schedule:
    - cron: "17 * * * *"   # cada hora (minuto 17, para esquivar la hora en punto que GitHub atrasa)
    # Cyber Monday (2 al 4 de noviembre, hora argentina): suma los minutos 2, 32 y 47 -> cada 15 minutos.
    # GitHub usa hora UTC (Argentina + 3): cubre desde el 1/11 21:00 hasta el 4/11 23:59 de Argentina.
    - cron: "2,32,47 21-23 1 11 *"
    - cron: "2,32,47 * 2-4 11 *"
    - cron: "2,32,47 0-2 5 11 *"
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write            # para guardar state.json, historial.csv y salud.json entre corridas

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Armar secrets.json desde los secretos de GitHub
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_SECRET: ${{ secrets.ML_SECRET }}
          ML_REFRESH: ${{ secrets.ML_REFRESH }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
        run: |
          python - <<'EOF'
          import json, os
          json.dump({"token": os.environ["TELEGRAM_TOKEN"], "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                     "ml_client_id": os.environ["ML_CLIENT_ID"], "ml_secret": os.environ["ML_SECRET"],
                     "ml_refresh": os.environ["ML_REFRESH"], "vapid_private": os.environ["VAPID_PRIVATE"],
                     "push_subs": json.loads(os.environ["PUSH_SUBS"] or "[]")}, open("secrets.json", "w"))
          EOF

      - name: Revisar tiendas
        run: python monitor.py

      - name: Guardar el nuevo permiso de Mercado Libre y los celulares para avisos
        # Mercado Libre entrega un refresh token nuevo cada vez que se renueva el acceso
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ML_REFRESH_ANTERIOR: ${{ secrets.ML_REFRESH }}
          PUSH_SUBS_ANTERIOR: ${{ secrets.PUSH_SUBS }}
          REPO: ${{ github.repository }}
        run: python nube.py guardar-refresh

      - name: Avisar si el monitor se rompe o el token vence
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RESULTADO: ${{ job.status }}
        run: python nube.py aviso-corrida

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          for f in state.json historial.csv salud.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "estado $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push
